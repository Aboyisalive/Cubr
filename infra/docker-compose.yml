# Local development stack: Postgres + the Go backend.
# Usage (from repo root): just db-up   /   just db-down
# Or directly: docker compose -f infra/docker-compose.yml up --build
name: cubr

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cubr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cubr}
      POSTGRES_DB: ${POSTGRES_DB:-cubr}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cubr_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cubr} -d ${POSTGRES_DB:-cubr}"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-cubr}:${POSTGRES_PASSWORD:-cubr}@db:5432/${POSTGRES_DB:-cubr}?sslmode=disable"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    # No in-container healthcheck: the distroless image has no shell or
    # HTTP client. Probe from the host: curl localhost:8080/healthz

volumes:
  cubr_db_data:
