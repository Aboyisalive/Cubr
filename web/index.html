<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="cubr — scan a scrambled Rubik's Cube, see it in 3D, and learn the solution one step at a time."
    />
    <title>cubr</title>
    <!-- Hero poster: the LCP element and WebGL2 fallback (F0.8). -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/hero-poster.webp"
      fetchpriority="high"
    />
    <!-- Apply the saved/system theme before first paint (no flash). -->
    <script>
      try {
        var stored = localStorage.getItem('cubr-theme')
        if (
          stored === 'dark' ||
          (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
